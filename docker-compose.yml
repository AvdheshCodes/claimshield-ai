version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insureguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insureguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insureguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-insureguard_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureguard -d insureguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19-community
    container_name: insureguard-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/insureguard_secret}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4jdata:/data

  redis:
    image: redis:7-alpine
    container_name: insureguard-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insureguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-insureguard}:${POSTGRES_PASSWORD:-insureguard_secret}@postgres:5432/${POSTGRES_DB:-insureguard_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-insureguard_secret}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insureguard-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
  uploads_data:
